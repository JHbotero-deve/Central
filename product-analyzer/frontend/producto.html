<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="/central.css">

<meta name="robots" content="index,follow">

<title>Producto | Central</title>
<meta name="description" content="Ficha de producto en Central.">

<link rel="canonical" id="canonical">

<meta property="og:type" content="product">
<meta property="og:site_name" content="Central">
<meta property="og:title" id="ogTitle" content="Producto | Central">
<meta property="og:description" id="ogDesc" content="Ficha de producto en Central.">
<meta property="og:image" id="ogImage" content="">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font:14px/1.55 Inter,system-ui
}
.shell{
    width:min(1180px,calc(100% - 28px));
    margin:auto
}
.top{
    height:74px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between
}
.brand{
    font:800 18px "Space Grotesk"
}
.back{
    color:var(--muted);
    font-size:11px
}
.product{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:30px;
    padding:45px 0
}
.media{
    min-height:520px;
    background:#0b0f15;
    border:1px solid var(--line);
    border-radius:18px;
    display:grid;
    place-items:center;
    padding:30px
}
.media img{
    max-width:100%;
    max-height:500px;
    object-fit:contain
}
.copy{
    padding:20px 0
}
.kicker{
    color:var(--lime);
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.12em
}
.copy h1{
    font:600 clamp(34px,5vw,64px)/1 "Space Grotesk";
    margin:12px 0
}
.desc{
    color:var(--muted);
    font-size:15px
}
.price{
    font:800 32px "Space Grotesk";
    color:var(--lime);
    margin:22px 0
}
.cta{
    display:inline-block;
    border:0;
    background:var(--lime);
    color:#0b1008;
    border-radius:9px;
    padding:13px 18px;
    font-weight:800;
    cursor:pointer;
    text-decoration:none
}
.cta.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--line);
    margin-left:8px
}
.meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:20px 0
}
.meta div{
    border:1px solid var(--line);
    padding:11px;
    border-radius:9px;
    background:var(--panel);
    font-size:11px;
    color:var(--muted)
}
.meta b{
    color:var(--text)
}
.gallery{
    display:flex;
    gap:8px;
    overflow:auto;
    margin-top:10px
}
.gallery img{
    width:78px;
    height:78px;
    object-fit:contain;
    background:#0b0f15;
    border:1px solid var(--line);
    border-radius:8px;
    cursor:pointer
}
.facts{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    margin-top:18px
}
.fact{
    border:1px solid var(--line);
    padding:11px;
    border-radius:9px;
    background:var(--panel);
    font-size:11px;
    color:var(--muted)
}
.fact b{
    display:block;
    color:var(--text);
    margin-top:4px;
    font-size:12px
}
.fact-wide{
    grid-column:1/-1
}
.fact-list{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:6px
}
.fact-list span{
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 7px;
    color:var(--text);
    font-size:10px
}
.status{
    margin:15px 0;
    color:var(--muted);
    font-size:11px
}
@media(max-width:800px){
    .product{
        grid-template-columns:1fr;
        padding:25px 0
    }
    .media{
        min-height:350px
    }
    .copy{
        padding:0
    }
}
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>

<div class="shell">

<header class="top">
    <a class="brand" href="/">CENTRAL</a>
    <a class="back" href="/tienda">← Tienda</a>
</header>

<main id="app">
    <div class="product">
        <div class="media">Cargando producto…</div>
        <div class="copy">Cargando…</div>
    </div>
</main>

</div>

<script>
(async()=>{

const API="/api/v1";

const esc=v=>String(v??"").replace(
    /[&<>"']/g,
    c=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    }[c])
);

const mediaSrc=url=>url?API+"/media/image?url="+encodeURIComponent(url):"";

const money=(v,c)=>{
    if(v==null||v==="") return "Consultar";

    const code=String(c||"COP").toUpperCase();

    try{
        return new Intl.NumberFormat("es-CO",{
            style:"currency",
            currency:code,
            maximumFractionDigits:0
        }).format(Number(v));
    }catch{
        return String(v);
    }
};

const pathSlug=
    new URLSearchParams(location.search).get("slug")
    || location.pathname.split("/").filter(Boolean).pop()
    || "";

const match=pathSlug.match(/-(\d+)\/?$/);
const id=match&&match[1];

if(!id){
    document.getElementById("app").innerHTML=
        "<p>Producto no encontrado.</p>";
    return;
}

const productUrl=(p)=>{
    const productId=String(p.id||p.product_id||id);

    let slug=String(p.title||"producto")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-|-$/g,"");

    slug=slug.replace(
        new RegExp("-"+productId+"$"),
        ""
    );

    return "/producto/"+slug+"-"+productId;
};

const unpackDescription=v=>{
    const s=String(v||"");

    const m=s.match(
        /\n*\[\[central:([A-Za-z0-9+\/=_-]+)\]\]\s*$/
    );

    if(!m) return s.trim();

    try{
        const bin=atob(m[1]);
        const bytes=Uint8Array.from(
            bin,
            c=>c.charCodeAt(0)
        );

        const meta=JSON.parse(
            new TextDecoder().decode(bytes)
        );

        return String(
            meta.text||s.slice(0,m.index)
        ).trim();

    }catch{
        return s.trim();
    }
};

try{
    const response=await fetch(
        API+"/products/"+encodeURIComponent(id),
        {
            cache:"no-store",
            headers:{
                "Accept":"application/json"
            }
        }
    );

    if(!response.ok){

        if(response.status===404){
            document.getElementById("app").innerHTML=
                "<p>Producto no encontrado.</p>";
        }else{
            document.getElementById("app").innerHTML=
                "<p>No fue posible cargar el producto.</p>";
        }

        return;
    }

    const data=await response.json();
    const p=data.product||data;

    if(!p||!p.id){

        document.getElementById("app").innerHTML=
            "<p>Producto no disponible.</p>";

        return;
    }

    const productId=String(p.id);

    const canonicalSlug=String(p.title||"producto")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-|-$/g,"")
        .replace(
            new RegExp("-"+productId+"$"),
            ""
        );

    const canonicalUrl=
        new URL(
            "/producto/"+canonicalSlug+"-"+productId,
            location.origin
        ).href;

    const realDescription=
        unpackDescription(p.description);

    const meta=
        p.source_metadata &&
        typeof p.source_metadata==="object"
            ?p.source_metadata
            :{};

    const shipping=
        meta.shipping &&
        typeof meta.shipping==="object"
            ?meta.shipping
            :{};

    const attrs=
        Array.isArray(meta.attributes)
            ?meta.attributes
            :[];

    const vars=
        Array.isArray(meta.variations)
            ?meta.variations
            :[];

    const tags=
        Array.isArray(meta.tags)
            ?meta.tags
            :[];

    const seller=
        p.seller_name
        ||(meta.seller&&meta.seller.name)
        ||"No informado";

    const reputation=
        p.seller_reputation
        ||(meta.seller&&meta.seller.reputation);

    let gallery=
        Array.isArray(p.image_gallery)
            ?p.image_gallery.filter(Boolean)
            :[];

    if(
        p.image_url &&
        !gallery.includes(p.image_url)
    ){
        gallery.unshift(p.image_url);
    }

    if(!gallery.length){

        document.getElementById("app").innerHTML=
            "<p>Producto disponible, pero la fuente no proporcionó una imagen.</p>";

        return;
    }

    const platform=
        String(p.platform||"").toLowerCase();

    const own=
        String(p.checkout_mode||"").toUpperCase()==="CENTRAL"
        ||platform==="personal";

    document.title=
        (p.title||"Producto")+" | Central";

    document.getElementById("canonical").href=
        canonicalUrl;

    document.getElementById("ogTitle").content=
        p.title||"Producto";

    document.getElementById("ogDesc").content=
        realDescription||"Ficha real del producto.";

    document.getElementById("ogImage").content=
        gallery[0];

    const attrText=attrs.map(a=>{
        const n=
            a&&a.name
            ||a&&a.id
            ||"Atributo";

        const v=
            a&&a.value_name
            ||a&&a.value
            ||a&&a.value_id
            ||"";

        return n+(v?": "+v:"");
    });

    const varText=vars.map(v=>{
        if(v&&v.attribute_combinations){
            return JSON.stringify(
                v.attribute_combinations
            );
        }

        return v&&v.id||"Variación";
    });

    const tagText=tags.map(x=>{
        if(typeof x==="string") return x;

        return x&&x.name
            ||x&&x.id
            ||"";
    });

    const shippingText=
        shipping.mode
        ||shipping.logistic_type
        ||shipping.free_shipping
            ?"Envío disponible"
            :"Información no informada";

    const attrHtml=attrText.length
        ?'<div class="fact-list">'+
          attrText.slice(0,30)
            .map(x=>'<span>'+esc(x)+'</span>')
            .join("")+
          '</div>'
        :"<b>No informados por la fuente</b>";

    const varHtml=varText.length
        ?'<div class="fact-list">'+
          varText.slice(0,20)
            .map(x=>'<span>'+esc(x)+'</span>')
            .join("")+
          '</div>'
        :"<b>No informadas por la fuente</b>";

    const tagHtml=tagText.length
        ?'<div class="fact-list">'+
          tagText.slice(0,30)
            .map(x=>'<span>'+esc(x)+'</span>')
            .join("")+
          '</div>'
        :"<b>No informadas por la fuente</b>";

    let buttonText="Ver oferta";

    if(own){
        buttonText="Añadir al carrito";
    }else if(platform==="amazon"){
        buttonText="Comprar en Amazon";
    }else if(
        platform==="mercadolibre"
        ||platform==="mercado libre"
        ||platform==="meli"
    ){
        buttonText="Ver oferta en Mercado Libre";
    }else if(platform==="aliexpress"){
        buttonText="Comprar en AliExpress";
    }

    document.getElementById("app").innerHTML=`
<div class="product">

<section>

    <div class="media">
        <img
            id="mainImg"
            src="${esc(mediaSrc(gallery[0]))}"
            alt="${esc(p.title)}"
        >
    </div>

    <div class="gallery">
        ${gallery.slice(0,10).map(x=>`
            <img
                src="${esc(mediaSrc(x))}"
                data-original="${esc(x)}"
                alt="${esc(p.title)}"
                loading="lazy"
            >
        `).join("")}
    </div>

</section>

<section class="copy">

    <div class="kicker">
        ${esc(p.platform||"Central")}
    </div>

    <h1>${esc(p.title)}</h1>

    <p class="desc">
        ${esc(
            realDescription
            ||"Información real disponible en la fuente."
        )}
    </p>

    <div class="price">
        ${esc(
            money(
                p.current_price,
                p.currency
            )
        )}
    </div>

    <div class="meta">

        <div>
            SKU / ID
            <br>
            <b>
                ${esc(
                    p.sku
                    ||p.external_id
                    ||p.id
                )}
            </b>
        </div>

        <div>
            Disponibilidad
            <br>
            <b>
                ${
                    p.stock==null||Number(p.stock)>0
                        ?"Disponible"
                        :"Agotado"
                }
            </b>
        </div>

        <div>
            Valoración
            <br>
            <b>
                ${
                    p.rating!=null
                        ?esc(p.rating)
                        :"No informada"
                }
                ${
                    p.reviews_count
                        ?" · "+esc(p.reviews_count)+" reseñas"
                        :""
                }
            </b>
        </div>

        <div>
            Ventas / demanda
            <br>
            <b>
                ${
                    p.sales_estimate!=null
                        ?esc(p.sales_estimate)
                        :"No informada"
                }
            </b>
        </div>

    </div>

    <div class="facts">

        <div class="fact">
            Vendedor
            <b>
                ${esc(seller)}
                ${
                    reputation!=null
                        ?" · reputación "+esc(reputation)
                        :""
                }
            </b>
        </div>

        <div class="fact">
            Envío
            <b>${esc(shippingText)}</b>
        </div>

        <div class="fact fact-wide">
            Atributos
            ${attrHtml}
        </div>

        <div class="fact fact-wide">
            Variaciones
            ${varHtml}
        </div>

        <div class="fact fact-wide">
            Etiquetas
            ${tagHtml}
        </div>

    </div>

    <div class="status" id="actionStatus"></div>

    <div class="meta">
        <div>Fuente original<br><b>${p.product_url?'<a href="'+esc(p.product_url)+'" target="_blank" rel="nofollow sponsored noopener">Abrir publicación</a>':"No disponible"}</b></div>
        <div>Actualizado<br><b>${esc(p.updated_at||"Fuente externa")}</b></div>
    </div>

    <button class="cta" id="buy">
        ${buttonText}
    </button>

    <a
        class="cta secondary"
        href="/tienda"
    >
        Volver a la tienda
    </a>

</section>

</div>
`;

    document
        .querySelectorAll(".gallery img")
        .forEach(x=>{
            x.onclick=()=>{
                document.getElementById(
                    "mainImg"
                ).src=x.src;
            };
        });

    document.getElementById("buy").onclick=async()=>{

        const status=
            document.getElementById(
                "actionStatus"
            );
        if(own){

            const pid=Number(p.id);

            const cart=
                JSON.parse(
                    localStorage.getItem(
                        "central_cart"
                    )||"[]"
                );

            const item=cart.find(
                x=>String(x.product_id)
                    ===String(pid)
            );

            if(item){
                item.quantity=
                    Number(item.quantity||0)+1;
            }else{

                cart.push({
                    product_id:pid,
                    title:p.title,
                    image_url:p.image_url,
                    price:Number(
                        p.current_price||0
                    ),
                    quantity:1
                });

            }

            localStorage.setItem(
                "central_cart",
                JSON.stringify(cart)
            );

            location.href="/tienda#cart";
            return;
        }
        if(
            platform==="amazon"
            ||platform==="mercadolibre"
            ||platform==="mercado libre"
            ||platform==="meli"
        ){

            status.textContent=
                "Preparando la oferta original…";

            try{

                const x=await fetch(
                    API+"/affiliate/click",
                    {
                        method:"POST",
                        headers:{
                            "Content-Type":
                                "application/json"
                        },
                        body:JSON.stringify({
                            product_id:Number(p.id)
                        })
                    }
                );

                const d=await x.json();

                if(x.ok&&d.url){

                    location.href=d.url;
                    return;
                }

                if(p.product_url){
                    location.href=
                        p.product_url;
                    return;
                }

                throw new Error(
                    d.detail
                    ||"No existe una URL comercial."
                );

            }catch(error){

                console.error(error);

                status.textContent=
                    "No fue posible abrir la oferta.";

                if(p.product_url){
                    setTimeout(()=>{
                        location.href=
                            p.product_url;
                    },300);
                }

                return;
            }
        }

        if(p.affiliate_url||p.product_url){
            location.href=p.affiliate_url||p.product_url;
            return;
        }

        status.textContent=
            "Este producto no tiene una URL comercial disponible.";
    };
    const schema={
        "@context":"https://schema.org",
        "@type":"Product",
        "name":p.title,
        "description":
            realDescription||p.title,
        "image":gallery.slice(0,10),
        "sku":
            p.sku
            ||p.external_id
            ||String(p.id),
        "offers":{
            "@type":"Offer",
            "url":canonicalUrl,
            "price":Number(
                p.current_price||0
            ),
            "priceCurrency":
                p.currency||"COP",
            "availability":
                "https://schema.org/"+
                (
                    p.stock==null
                    ||Number(p.stock)>0
                        ?"InStock"
                        :"OutOfStock"
                )
        }
    };

    if(
        p.rating!=null
        &&p.reviews_count
    ){

        schema.aggregateRating={
            "@type":"AggregateRating",
            "ratingValue":
                Number(p.rating),
            "reviewCount":
                Number(p.reviews_count)
        };
    }

    const sc=
        document.createElement("script");

    sc.type="application/ld+json";
    sc.textContent=
        JSON.stringify(schema);

    document.head.appendChild(sc);

}catch(error){

    console.error(error);

    document.getElementById("app").innerHTML=
        "<p>No fue posible cargar la ficha real del producto.</p>";
}

})();
</script>

</body>
</html>
