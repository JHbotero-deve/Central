<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Producto | Central</title><meta name="description" content="Producto publicado en Central."><link rel="canonical" id="canonical"><meta property="og:type" content="product"><meta property="og:site_name" content="Central"><meta property="og:title" id="ogTitle" content="Producto | Central"><meta property="og:description" id="ogDesc" content="Producto publicado en Central."><meta property="og:image" id="ogImage" content=""><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><style>:root{--bg:#07090d;--panel:#0e121a;--line:#202936;--text:#f5f7fa;--muted:#8c97a8;--lime:#b6f23a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.top{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font:800 18px "Space Grotesk"}.back{color:var(--muted);font-size:11px}.product{display:grid;grid-template-columns:1fr 1fr;gap:30px;padding:45px 0}.media{min-height:520px;background:#0b0f15;border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;padding:30px}.media img{max-width:100%;max-height:500px;object-fit:contain}.copy{padding:20px 0}.kicker{color:var(--lime);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.copy h1{font:600 clamp(34px,5vw,64px)/1 "Space Grotesk";margin:12px 0}.desc{color:var(--muted);font-size:15px}.price{font:800 32px "Space Grotesk";color:var(--lime);margin:22px 0}.cta{border:0;background:var(--lime);color:#0b1008;border-radius:9px;padding:13px 18px;font-weight:800;cursor:pointer}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}.meta div{border:1px solid var(--line);padding:11px;border-radius:9px;background:var(--panel);font-size:11px;color:var(--muted)}.gallery{display:flex;gap:8px;overflow:auto;margin-top:10px}.gallery img{width:70px;height:70px;object-fit:contain;background:#0b0f15;border:1px solid var(--line);border-radius:8px;cursor:pointer}@media(max-width:800px){.product{grid-template-columns:1fr}.media{min-height:350px}}</style><style>.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}.fact{border:1px solid var(--line);padding:11px;border-radius:9px;background:var(--panel);font-size:11px;color:var(--muted)}.fact b{display:block;color:var(--text);margin-top:4px;font-size:12px}.fact-wide{grid-column:1/-1}.fact-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.fact-list span{border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--text);font-size:10px}</style></head><body><div class="shell"><header class="top"><a class="brand" href="/">CENTRAL</a><a class="back" href="/tienda">← Tienda</a></header><main id="app"><div class="product"><div class="media">Cargando producto…</div><div class="copy">Cargando…</div></div></main></div><script>(async()=>{
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v,c)=>{if(v==null||v==="")return"Consultar";try{return new Intl.NumberFormat("es-CO",{style:"currency",currency:String(c||"COP").toUpperCase()==="USD"?"USD":"COP",maximumFractionDigits:0}).format(Number(v))}catch{return String(v)}};
const m=location.pathname.match(/-(\d+)\/?$/),id=m&&m[1];
if(!id){document.getElementById("app").innerHTML="<p>Producto no encontrado.</p>";return}
try{
 const [pubRes,fullRes]=await Promise.all([fetch("/api/publications/product/"+id,{cache:"no-store"}),fetch("/api/products/"+id,{cache:"no-store"})]);
 if(!pubRes.ok){document.getElementById("app").innerHTML="<p>Producto no disponible.</p>";return}
 const p=await pubRes.json(), full=fullRes.ok?(await fullRes.json()).product||{}:{}, url=p.canonical_url;
 const meta=full.source_metadata&&typeof full.source_metadata==="object"?full.source_metadata:{};
 const shipping=meta.shipping&&typeof meta.shipping==="object"?meta.shipping:{};
 const attrs=Array.isArray(meta.attributes)?meta.attributes:[], vars=Array.isArray(meta.variations)?meta.variations:[], tags=Array.isArray(meta.tags)?meta.tags:[];
 const seller=full.seller_name||meta.seller?.name||"No informado", reputation=full.seller_reputation||meta.seller?.reputation;
 const gallery=[...(p.image_gallery||[])].filter(Boolean);if(p.image_url&&!gallery.includes(p.image_url))gallery.unshift(p.image_url);
 if(!gallery.length){document.getElementById("app").innerHTML="<p>Producto no disponible: no tiene imagen real.</p>";return}
 document.title=(p.title||"Producto")+" | Central";document.getElementById("canonical").href=url;document.getElementById("ogTitle").content=p.title||"Producto";document.getElementById("ogDesc").content=p.description||p.subtitle||"Ficha real del producto.";document.getElementById("ogImage").content=gallery[0];
 const attrText=attrs.map(a=>{const n=a&&a.name||a&&a.id||"Atributo",v=a&&a.value_name||a&&a.value||a&&a.value_id||"";return n+(v?": "+v:"")});
 const varText=vars.map(v=>v&&v.attribute_combinations?JSON.stringify(v.attribute_combinations):v&&v.id||"Variación");
 const tagText=tags.map(x=>typeof x==="string"?x:x&&x.name||x&&x.id||"");
 const shippingText=shipping.mode||shipping.logistic_type||shipping.free_shipping?"Envío disponible":"Información no informada";
 const attrHtml=attrText.length?'<div class="fact-list">'+attrText.slice(0,30).map(x=>'<span>'+esc(x)+'</span>').join("")+'</div>':'<b>No informados por la fuente</b>';
 const varHtml=varText.length?'<div class="fact-list">'+varText.slice(0,20).map(x=>'<span>'+esc(x)+'</span>').join("")+'</div>':'<b>No informadas por la fuente</b>';
 const tagHtml=tagText.length?'<div class="fact-list">'+tagText.slice(0,30).map(x=>'<span>'+esc(x)+'</span>').join("")+'</div>':'<b>No informadas por la fuente</b>';
 document.getElementById("app").innerHTML='<div class="product"><section><div class="media"><img id="mainImg" src="'+esc(gallery[0])+'" alt="'+esc(p.title)+'"></div><div class="gallery">'+gallery.slice(0,8).map(x=>'<img src="'+esc(x)+'" alt="'+esc(p.title)+'">').join("")+'</div></section><section class="copy"><div class="kicker">'+esc(p.platform||"Central")+'</div><h1>'+esc(p.title)+'</h1><p class="desc">'+esc(full.description||p.description||p.subtitle||"Información real disponible en la fuente.")+'</p><div class="price">'+esc(p.price_display||money(p.sale_price||p.current_price,p.currency))+'</div><div class="meta"><div>SKU / ID<br><b>'+esc(p.sku||p.external_id||p.product_id)+'</b></div><div>Disponibilidad<br><b>'+((p.stock==null||p.stock>0)?"Disponible":"Agotado")+'</b></div><div>Valoración<br><b>'+esc(p.rating!=null?p.rating:"No informada")+(p.reviews_count?" · "+p.reviews_count+" reseñas":"")+'</b></div><div>Ventas / demanda<br><b>'+esc(p.sales_estimate!=null?p.sales_estimate:"No informada")+'</b></div></div><div class="facts"><div class="fact">Vendedor<b>'+esc(seller)+(reputation!=null?" · reputación "+esc(reputation):"")+'</b></div><div class="fact">Envío<b>'+esc(shippingText)+'</b></div><div class="fact fact-wide">Atributos'+attrHtml+'</div><div class="fact fact-wide">Variaciones'+varHtml+'</div><div class="fact fact-wide">Etiquetas'+tagHtml+'</div></div><button class="cta" id="buy">'+(String(p.platform).toLowerCase()==="amazon"?"Comprar en Amazon":p.checkout_mode==="CENTRAL"?"Comprar con Wompi":"Ver oferta")+'</button></section></div>';
 document.querySelectorAll(".gallery img").forEach(x=>x.onclick=()=>document.getElementById("mainImg").src=x.src);
 document.getElementById("buy").onclick=async()=>{if(String(p.platform).toLowerCase()==="amazon"){try{const x=await fetch("/api/affiliate/click",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({product_id:p.product_id})});const d=await x.json();if(x.ok&&d.url){location.href=d.url;return}}catch{}if(p.product_url)location.href=p.product_url;else alert("El producto no tiene una URL de Amazon válida")}else if(p.checkout_mode==="CENTRAL"){const pid=Number(p.product_id),cart=JSON.parse(localStorage.getItem("central_cart")||"[]"),item=cart.find(x=>String(x.product_id)===String(pid));if(item)item.quantity++;else cart.push({product_id:pid,publication_id:p.id,title:p.title,image_url:p.image_url,price:Number(p.sale_price||p.current_price||0),quantity:1});localStorage.setItem("central_cart",JSON.stringify(cart));location.href="/tienda#cart"}else if(p.product_url)location.href=p.product_url};
 const schema={"@context":"https://schema.org","@type":"Product","name":p.title,"description":full.description||p.description||p.subtitle||p.title,"image":gallery.slice(0,10),"sku":p.sku||p.external_id||String(p.product_id),"offers":{"@type":"Offer","url":url,"price":Number(p.sale_price||p.current_price||0),"priceCurrency":p.currency,"availability":"https://schema.org/"+((p.stock==null||p.stock>0)?"InStock":"OutOfStock")}};
 if(p.rating!=null&&p.reviews_count){schema.aggregateRating={"@type":"AggregateRating","ratingValue":Number(p.rating),"reviewCount":Number(p.reviews_count)}}
 const sc=document.createElement("script");sc.type="application/ld+json";sc.textContent=JSON.stringify(schema);document.head.appendChild(sc)
}catch(e){console.error(e);document.getElementById("app").innerHTML="<p>No fue posible cargar la ficha real del producto.</p>"}
})()</script></body></html>
