<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central — Catálogo activo</title>
<link rel="stylesheet" href="/central.css">
<style>
body{margin:0;background:#f3eee5;color:#20241f;font:14px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.head{padding:32px 0 20px;border-bottom:1px solid #d8d0c4}.head-row,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.eyebrow{font:11px "JetBrains Mono",monospace;text-transform:uppercase;color:#69715f;letter-spacing:.08em}h1{margin:6px 0;font-size:32px}p{color:#6c706b}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:24px 0}.card{background:#fffdf8;border:1px solid #d8d0c4;border-radius:10px;overflow:hidden}.media{height:190px;background:#eee7dc;display:grid;place-items:center}.media img{width:100%;height:100%;object-fit:contain;padding:12px;box-sizing:border-box}.body{padding:13px}.title{font-weight:650;min-height:42px}.meta{margin-top:7px;color:#777;font-size:12px}.price{margin-top:9px;font:700 15px "JetBrains Mono";color:#55652f}.actions{justify-content:flex-start;margin-top:13px}.btn{border:1px solid #c9c0b2;background:#fffdf8;color:#20241f;border-radius:7px;padding:8px 11px;text-decoration:none;font-weight:600;cursor:pointer}.btn.danger{border-color:#bba4a0}.empty{padding:36px;text-align:center;border:1px dashed #c9c0b2}.login{max-width:420px;margin:70px auto;background:#fffdf8;border:1px solid #d8d0c4;border-radius:10px;padding:24px}.field{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #c9c0b2;border-radius:7px;box-sizing:border-box}.error{color:#8b3f38;min-height:20px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
<main class="wrap">
<section class="head">
<div class="eyebrow">Central · operación</div>
<div class="head-row"><div><h1>Catálogo activo</h1><p>Productos activos de Central. Revisa cada producto, abre su ficha en la tienda o dale de baja.</p></div><div class="actions"><a class="btn" href="/central">Volver a Central</a><a class="btn" href="/tarjetas">Crear tarjeta</a><button class="btn" id="refresh">Actualizar</button></div></div>
</section>
<section id="content"><div id="status" class="meta">Cargando…</div><div class="grid" id="grid"></div></section>
</main>
<script>
(()=>{"use strict";
const API="/api/v1",$=id=>document.getElementById(id);
const headers=()=>({Accept:"application/json"});
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(v,c)=>{if(v==null)return"—";const currency=String(c||"COP").toUpperCase();if(currency==="COP")return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(v));return new Intl.NumberFormat("es-CO",{style:"currency",currency}).format(Number(v))};
const storeUrl=p=>p.is_published?"/producto/"+String(p.title||"producto").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+p.id:null;
async function load(){try{const r=await fetch(API+"/catalog/active",{cache:"no-store",credentials:"include",headers:headers()});if(!r.ok)throw new Error("HTTP "+r.status);const items=await r.json();$("status").textContent=items.length+" productos activos";$("grid").innerHTML=items.length?items.map(card).join(""):'<div class="empty">No hay productos activos.</div>'}catch(e){$("status").textContent="No fue posible cargar el catálogo";$("grid").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function card(p){const gallery=Array.isArray(p.image_gallery)?p.image_gallery.filter(Boolean):[];const image=p.image_url||gallery[0];const src=image?"/api/v1/media/image?url="+encodeURIComponent(image):"";const store=storeUrl(p);return '<article class="card"><div class="media">'+(src?'<img src="'+esc(src)+'" alt="'+esc(p.title)+'" loading="lazy">':'Sin imagen')+'</div><div class="body"><div class="title">'+esc(p.title)+'</div><div class="meta">'+esc(p.platform)+" · "+esc(p.category||"sin categoría")+'</div><div class="price">'+money(p.current_price,p.currency)+'</div><div class="actions">'+(store?'<a class="btn" href="'+esc(store)+'" target="_blank" rel="noopener noreferrer">Ver en tienda</a>':"")+(p.product_url?'<a class="btn" href="'+esc(p.product_url)+'" target="_blank" rel="noopener noreferrer">Original</a>':"")+'<button class="btn danger" data-remove="'+p.id+'">Dar de baja</button></div></div></article>'}
async function remove(id){if(!confirm("¿Dar de baja este producto? Dejará de aparecer del catálogo activo y de la tienda."))return;const r=await fetch(API+"/products/"+id,{method:"DELETE",credentials:"include",headers:headers()});if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.detail||"No fue posible darlo de baja");return}await load()}
$("grid").addEventListener("click",e=>{const b=e.target.closest("[data-remove]");if(b)remove(b.dataset.remove)});
$("refresh").addEventListener("click",load);
load();
