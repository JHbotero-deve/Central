<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Tarjetas propias | Central</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/central.css">
</head><body>
<div class="cn-wrap">
  <header class="cn-top"><a class="cn-brand" href="/">CENTRAL</a><nav><a href="/">Radar</a><a href="/tienda">Tienda</a><a href="#" id="logout" hidden>Cerrar sesion</a></nav></header>
  <span class="cn-eyebrow">Tarjetas propias</span>
  <h1 class="cn-h1">Crea tus productos.</h1>
  <p class="cn-muted">Se guardan en tu base de datos y aparecen en el catalogo como fuente "personal".</p>

  <section id="auth" class="cn-card cn-pad cn-stack" style="max-width:420px;margin-top:24px" hidden>
    <strong>Acceso de administrador</strong>
    <label class="cn-field">Usuario o correo<input class="cn-input" id="u" autocomplete="username"></label>
    <label class="cn-field">Contrasena<input class="cn-input" id="p" type="password" autocomplete="current-password"></label>
    <button class="cn-btn" id="loginBtn">Entrar</button>
    <details><summary class="cn-muted" style="cursor:pointer;font-size:12px">Ya tengo un token</summary>
      <div class="cn-stack" style="margin-top:10px"><input class="cn-input" id="t" placeholder="Pega el token"><button class="cn-btn cn-btn--ghost" id="tokBtn">Usar token</button></div>
    </details>
    <div id="authMsg" class="cn-msg cn-msg--err" hidden></div>
  </section>

  <section id="editor" hidden>
    <div class="cn-two">
      <div class="cn-card cn-pad cn-stack">
        <span class="cn-eyebrow">Nueva tarjeta</span>
        <label class="cn-field">Titulo *<input class="cn-input" id="title" maxlength="500" placeholder="Ej. Zapatillas Origen Runner"></label>
        <label class="cn-field">Descripcion<input class="cn-input" id="description" maxlength="5000" placeholder="Opcional"></label>
        <div class="cn-row">
          <label class="cn-field">Precio *<input class="cn-input" id="price" type="number" min="0" step="any"></label>
          <label class="cn-field">Precio anterior<input class="cn-input" id="previous_price" type="number" min="0" step="any"></label>
        </div>
        <div class="cn-row">
          <label class="cn-field">Moneda<select class="cn-input" id="currency"><option>COP</option><option>USD</option></select></label>
          <label class="cn-field">Categoria<input class="cn-input" id="category" placeholder="zapatos, camisas..."></label>
        </div>
        <div class="cn-row">
          <label class="cn-field">SKU<input class="cn-input" id="sku" maxlength="150" placeholder="Auto si lo dejas vacio"></label>
          <label class="cn-field">Stock<input class="cn-input" id="stock" type="number" min="0" step="1"></label>
        </div>
        <label class="cn-field">Imagen (archivo)<input class="cn-input" id="file" type="file" accept="image/*"></label>
        <label class="cn-field">o URL de imagen<input class="cn-input" id="image_url" placeholder="https://..."></label>
        <label class="cn-field">URL del producto / compra<input class="cn-input" id="product_url" placeholder="https://..."></label>
        <button class="cn-btn" id="save">Crear tarjeta</button>
        <div id="msg" class="cn-msg" hidden></div>
      </div>
      <div class="cn-stack">
        <span class="cn-eyebrow">Vista previa</span>
        <div id="preview" style="max-width:240px"></div>
      </div>
    </div>
    <span class="cn-eyebrow">Tus tarjetas</span>
    <div id="mine" class="cn-grid" style="margin-top:12px"></div>
  </section>
</div>

<script>
(()=>{"use strict";
const API="/api/v1",KEY="central_admin_token",$=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tok=()=>localStorage.getItem(KEY)||"";
const money=(v,c)=>{if(v===""||v==null||isNaN(Number(v)))return"—";try{return new Intl.NumberFormat("es-CO",{style:"currency",currency:c||"COP",maximumFractionDigits:0}).format(Number(v))}catch{return v+" "+c}};
let imageData="";

async function api(path,opt={}){
  const h={Accept:"application/json",...(opt.headers||{})}; if(tok())h.Authorization="Bearer "+tok();
  const r=await fetch(API+path,{cache:"no-store",...opt,headers:h});
  let b=null; try{b=await r.json()}catch{}
  if(!r.ok){const d=b&&b.detail;const e=new Error(typeof d==="string"?d:(d?JSON.stringify(d):"HTTP "+r.status));e.status=r.status;throw e}
  return b;
}
async function login(u,p){
  const tries=[
    {t:"application/json",b:JSON.stringify({username:u,password:p})},
    {t:"application/x-www-form-urlencoded",b:new URLSearchParams({username:u,password:p}).toString()},
    {t:"application/json",b:JSON.stringify({email:u,password:p})}];
  let last="Credenciales invalidas";
  for(const x of tries){
    const r=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":x.t,Accept:"application/json"},body:x.b});
    const j=await r.json().catch(()=>({}));
    if(r.ok){const k=j.access_token||j.token;if(!k)throw new Error("La respuesta no trae token");return k}
    if(typeof j.detail==="string")last=j.detail;
    if(r.status!==422&&r.status!==400)break;
  }
  throw new Error(last);
}
function show(el,kind,text){el.hidden=false;el.className="cn-msg "+(kind==="ok"?"cn-msg--ok":"cn-msg--err");el.textContent=text}
function gate(){const ok=!!tok();$("auth").hidden=ok;$("editor").hidden=!ok;$("logout").hidden=!ok;if(ok)loadMine()}

function cardHtml(p){
  const img=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}" loading="lazy" referrerpolicy="no-referrer">`:`<span class="cn-muted">Sin imagen</span>`;
  const old=p.previous_price?`<span class="cn-old">${money(p.previous_price,p.currency)}</span>`:"";
  return `<article class="cn-card"><div class="cn-media">${img}</div><div class="cn-body"><span class="cn-badge">${esc(p.category||"personal")}</span><div class="cn-title">${esc(p.title||"Titulo de tu producto")}</div><div class="cn-price">${money(p.price??p.current_price,p.currency)}${old}</div></div></article>`;
}
function form(){return{
  title:$("title").value.trim(),description:$("description").value.trim(),price:$("price").value,
  previous_price:$("previous_price").value,currency:$("currency").value,category:$("category").value.trim()||"otros",
  sku:$("sku").value.trim(),stock:$("stock").value,image_url:imageData||$("image_url").value.trim(),product_url:$("product_url").value.trim()}}
function preview(){$("preview").innerHTML=cardHtml(form())}
async function loadMine(){
  try{
    const d=await api("/products?limit=50"); const list=Array.isArray(d)?d:(d.items||d.products||[]);
    const mine=list.filter(p=>String(p.platform||"").toLowerCase()==="personal");
    $("mine").innerHTML=mine.length?mine.map(cardHtml).join(""):'<div class="cn-muted">Aun no hay tarjetas propias en las ultimas 50.</div>';
  }catch(e){$("mine").innerHTML='<div class="cn-msg cn-msg--err">No se pudo cargar: '+esc(e.message)+'</div>'}
}
function fileToDataUrl(file,max=900){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const x=c.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.82))};
  img.onerror=()=>rej(new Error("Imagen no valida"));img.src=url})}

$("loginBtn").addEventListener("click",async()=>{
  const b=$("loginBtn");b.disabled=true;$("authMsg").hidden=true;
  try{localStorage.setItem(KEY,await login($("u").value.trim(),$("p").value));gate()}
  catch(e){show($("authMsg"),"err",e.message)}finally{b.disabled=false}});
$("tokBtn").addEventListener("click",()=>{const v=$("t").value.trim();if(v){localStorage.setItem(KEY,v);gate()}});
$("logout").addEventListener("click",e=>{e.preventDefault();localStorage.removeItem(KEY);gate()});
["title","description","price","previous_price","currency","category","image_url"].forEach(id=>$(id).addEventListener("input",preview));
$("file").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
  try{imageData=await fileToDataUrl(f);preview()}catch(err){show($("msg"),"err",err.message)}});
$("save").addEventListener("click",async()=>{
  const v=form(),m=$("msg");m.hidden=true;
  if(v.title.length<2)return show(m,"err","El titulo necesita al menos 2 caracteres");
  if(!(Number(v.price)>0))return show(m,"err","El precio debe ser mayor a 0");
  if(v.product_url&&!/^https?:\/\//i.test(v.product_url))return show(m,"err","La URL del producto debe iniciar con http(s)://");
  const body={title:v.title,description:v.description||null,price:Number(v.price),
    previous_price:Number(v.previous_price)>0?Number(v.previous_price):null,currency:v.currency,category:v.category,
    image_url:v.image_url||null,product_url:v.product_url||null,sku:v.sku||null,stock:v.stock!==""?parseInt(v.stock,10):null};
  const b=$("save");b.disabled=true;
  try{
    await api("/products/personal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    show(m,"ok","Tarjeta creada");
    ["title","description","price","previous_price","category","sku","stock","image_url","product_url"].forEach(id=>$(id).value="");
    $("file").value="";imageData="";preview();loadMine();
  }catch(e){
    if(e.status===401){localStorage.removeItem(KEY);gate();show($("authMsg"),"err","Sesion vencida, entra de nuevo")}
    else show(m,"err",e.message)
  }finally{b.disabled=false}});
preview();gate();
})();
</script>
</body></html>
